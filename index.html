15px;margin:16px 0}.garden-sky{font-size:32px;letter-spacing:16px}.garden-land{min-height:90px;display:flex;justify-content:center;align-items:end;flex-wrap:wrap;gap:6px;font-size:29px}.garden-path{font-size:24px;margin-top:10px}.garden-map{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.garden-zone{border-radius:19px;padding:15px 10px;text-align:center;min-height:185px;border:2px solid #f6d0e1}.zone-open{background:linear-gradient(140deg,#fff5f9,#e8f8e7)}.zone-locked{background:#f7f0f5}.zone-art{font-size:46px;margin-bottom:10px}.garden-zone h3{color:#a83d78}.garden-zone .btn{font-size:12px;padding:10px}.water-count{text-align:center;font-size:64px;font-weight:800;color:#a83d78;margin:24px 0}.water-count span{display:block;font-size:15px;color:#a2758e;font-weight:400}@media(max-width:380px){.garden-map{grid-template-columns:1fr}}@media(min-width:550px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}

</style></head><body><div id="welcomeScreen" role="dialog" aria-modal="true" aria-labelledby="welcomeTitle"><div class="welcome-cover"><div class="welcome-kicker">✦ Your magical notebook ✦</div><div class="welcome-decoration">🌸 🦋 ✨</div><h1 id="welcomeTitle">Welcome to<br>GlowUp</h1><p class="welcome-tagline">Where dreams come true ♡</p><p class="welcome-small">A little space for your goals, memories, and magic</p><button class="welcome-enter" id="enterGlowUp" type="button">Open my notebook 📖 →</button><div class="welcome-decoration" style="font-size:28px">🎀 🌷 💗</div></div></div><main class="app"><header class="top"><div><div class="logo">glowup ୨୧</div><div class="sub">your goals, your glow ✨</div></div><div class="pill">⭐ <span id="stars">0</span></div></header><div id="view"></div></main><nav class="tabs"><div class="tabs-inner" id="tabs"></div></nav><script>
'use strict';const KEY='glowup-v3',OLD='glowup-v1';const today=()=>new Date().toLocaleDateString('en-CA');const dateBefore=(s,n)=>{let d=new Date(s+'T12:00:00');d.setDate(d.getDate()-n);return d.toLocaleDateString('en-CA')};const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const initial=()=>({goals:[{id:'a',name:'Read for 15 minutes',icon:'📚',points:15,dates:[]},{id:'b',name:'Tidy my space',icon:'🎀',points:15,dates:[]}],stars:0,spent:0,unlocked:[],journal:[],moods:{},water:{},avatar:{face:'👩',accessory:'🎀',background:'🌸'},focusSessions:0,focusMinutes:0,gardenUnlocked:[],notebook:{owned:[],pages:{}}});let state;try{state=JSON.parse(localStorage.getItem(KEY))||initial()}catch{state=initial()}if(!Array.isArray(state.goals))state=initial();state={...initial(),...state};state.notebook=state.notebook||{owned:[],pages:{}};state.notebook.owned=state.notebook.owned||[];state.notebook.pages=state.notebook.pages||{};let bookMonth=new Date().getMonth(),bookYear=new Date().getFullYear(),bookSection='Cover';let page='Notebook',editing=null,timerSeconds=25*60,timerRunning=false,timerHandle=null,timerLength=25;const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{alert('Storage is unavailable in this browser. Your changes may not be saved.')}};const earned=()=>Math.max(0,(state.stars||0)-(state.spent||0));const completed=g=>(g.dates||[]).includes(today());const todayCount=()=>state.goals.filter(completed).length;const lifetime=()=>state.goals.reduce((n,g)=>n+(g.dates||[]).length,0);const activeDays=()=>[...new Set(state.goals.flatMap(g=>g.dates||[]))];function streak(){let dates=activeDays();let start=dates.includes(today())?today():dateBefore(today(),1),n=0;while(dates.includes(start)){n++;start=dateBefore(start,1)}return n}function level(){return Math.floor(lifetime()/5)+1}const navigation=[['Notebook','📖'],['Home','🏠'],['Goals','♡'],['Rewards','🎁'],['Hydration','💧'],['Mood','💗'],['Journal','📔'],['Garden','🌸'],['Focus','🎧'],['Me','⚙️']];function sync(){document.getElementById('stars').textContent=earned();document.getElementById('tabs').innerHTML=navigation.map(([p,icon])=>`<button class="tab ${page===p?'active':''}" data-page="${p}" aria-label="Open ${p}"><span>${icon}</span>${p}</button>`).join('');document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()})}function render(){sync();let v=document.getElementById('view');if(page==='Notebook')v.innerHTML=notebook();if(page==='Home')v.innerHTML=home();if(page==='Goals')v.innerHTML=goals();if(page==='Rewards')v.innerHTML=rewards();if(page==='Hydration')v.innerHTML=hydration();if(page==='Mood')v.innerHTML=moodPage();if(page==='Garden')v.innerHTML=garden();if(page==='Journal')v.innerHTML=journal();if(page==='Focus')v.innerHTML=focus();if(page==='Me')v.innerHTML=me();bind();}
const bookThemes=[['❄️','Snowflake Wishes','#dff0fb','#547a9b'],['💌','Love Letters','#ffe1eb','#b65c85'],['🦋','Butterfly Dreams','#e9dcfa','#8666a5'],['🌷','Spring Garden','#e3f4df','#6d9977'],['🍓','Strawberry Picnic','#ffe2e7','#b9556a'],['🐚','Ocean Pearls','#dff4f5','#4e929c'],['🍒','Cherry Summer','#ffe0e6','#a74464'],['🌻','Sunshine Days','#fff1ca','#b18a36'],['📚','Cosy Academia','#f3e4d3','#977354'],['🎃','Spooky Cute','#f9dfc9','#a46c63'],['☕','Autumn Café','#eaddd2','#916d58'],['🎄','Sugarplum Christmas','#f5e0ed','#a0648e']];
const bookSections=['Cover','Goals','Mood','Hydration','Journal','Garden','Free page'];
const bookStickers=[['🎀','Pretty bow',0],['💗','Heart',10],['🦋','Butterfly',15],['🌸','Blossom',20],['🍓','Strawberry',25],['⭐','Golden star',30],['🧸','Teddy',35],['🌷','Tulip',40],['🌙','Moon',45],['👑','Crown',50],['💌','Letter',55],['✨','Sparkles',60]];
function bookId(){return bookYear+'-'+String(bookMonth+1).padStart(2,'0')+'-'+bookSection}
function bookData(){let k=bookId();return state.notebook.pages[k]||(state.notebook.pages[k]={note:'',stickers:[]})}
function notebook(){let t=bookThemes[bookMonth],data=bookData(),d=new Date(bookYear,bookMonth+1,0).getDate(),month=new Date(bookYear,bookMonth,1).toLocaleString('en-GB',{month:'long'});let sectionContent='';if(bookSection==='Cover')sectionContent=`<div class="cover-flower">${t[0]}</div><h2>${month} ${bookYear}</h2><p>${t[1]}</p><p class="muted">A little book of lovely moments ♡</p>`;
if(bookSection==='Goals')sectionContent=`<h2>My goals ♡</h2><p class="muted">Tick off goals on the Goals tab to earn stars.</p>${state.goals.map(g=>`<div class="goal"><span>${safe(g.icon)}</span><div class="grow">${safe(g.name)}</div><span>${completed(g)?'✅':'◯'}</span></div>`).join('')}<button class="btn secondary" data-page="Goals">Open my goals →</button>`;
if(bookSection==='Mood')sectionContent=`<h2>Mood memories 💗</h2><p class="muted">Your check-ins this month</p><div class="mood-calendar">${Array.from({length:d},(_,i)=>{let k=bookYear+'-'+String(bookMonth+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0');return `<div class="mood-cell"><small>${i+1}</small><span>${state.moods[k]||'♡'}</span></div>`}).join('')}</div><button class="btn secondary" data-page="Mood">Track my mood →</button>`;
if(bookSection==='Hydration')sectionContent=`<h2>Water tracker 💧</h2><p class="muted">Your water check-ins this month</p><div class="mood-calendar">${Array.from({length:d},(_,i)=>{let k=bookYear+'-'+String(bookMonth+1).padStart(2,'0')+'-'+String(i+1).padStart(2,'0');return `<div class="mood-cell"><small>${i+1}</small><span>💧${state.water[k]||0}</span></div>`}).join('')}</div><button class="btn secondary" data-page="Hydration">Log water →</button>`;
if(bookSection==='Journal')sectionContent=`<h2>Dear diary... 📔</h2><p class="muted">Your journal entries live in the Journal tab.</p><button class="btn secondary" data-page="Journal">Open journal →</button>`;
if(bookSection==='Garden')sectionContent=`<h2>My secret garden 🌸</h2><div class="garden-mini">🌷 🌸 🦋 🌼 🌹<br>🌿 🌱 🌻 🌷 🌿</div><p>${1+(state.gardenUnlocked||[]).length} garden areas discovered!</p><button class="btn secondary" data-page="Garden">Explore garden →</button>`;
if(bookSection==='Free page')sectionContent=`<h2>My creative corner ✨</h2><textarea id="bookNote" class="creative-writing" maxlength="5000" placeholder="Write a memory, a dream or anything you like! ♡" aria-label="Write directly on your notebook page">${safe(data.note)}</textarea>`;
return `<section class="book-toolbar"><div><span class="book-label">YOUR MAGIC NOTEBOOK</span><h1>GlowUp Journal 📖</h1><p>Every month is a new little world.</p></div><div class="pill">⭐ ${earned()}</div></section><section class="book-controls"><button class="btn secondary" id="prevBook" aria-label="Previous month">❮</button><strong>${month} ${bookYear} · ${t[1]}</strong><button class="btn secondary" id="nextBook" aria-label="Next month">❯</button></section><div class="book-wrap" style="--book-bg:${t[2]};--book-ink:${t[3]}"><div class="book-spine"></div><div class="book-page"><div class="book-top">${t[0]} ${safe(t[1])} <span>୨୧</span></div><div class="book-sections">${bookSections.map(x=>`<button class="book-tab ${bookSection===x?'chosen':''}" data-section="${x}">${x}</button>`).join('')}</div><div class="book-paper"><div class="book-content">${sectionContent}</div><div class="placed-stickers">${data.stickers.map((x,i)=>`<button class="placed-sticker" style="left:${x.x}%;top:${x.y}%" data-remove-sticker="${i}" title="Tap to remove sticker">${safe(x.emoji)}</button>`).join('')}</div></div>${bookSection==='Free page'?'<p class="muted small">Your writing and decorations save automatically. Tap a sticker to remove it.</p>':`<label for="bookNote">Notes on this page ♡</label><textarea id="bookNote" maxlength="1500" rows="3" placeholder="Write something sweet here...">${safe(data.note)}</textarea><p class="muted small">Notes and decorations save automatically. Tap a placed sticker to remove it.</p>`}</div></div><section class="card"><h2>Sticker boutique 🎀</h2><p class="muted">Earn stars from goals, unlock stickers once, and decorate as many pages as you like. Tap an owned sticker to add it to this page!</p><div class="sticker-grid">${bookStickers.map(([emoji,name,cost])=>{let owned=cost===0||state.notebook.owned.includes(emoji);return `<div class="sticker-item"><span class="sticker-art">${emoji}</span><b>${name}</b><button class="btn secondary" ${!owned&&earned()<cost?'disabled':''} data-sticker="${emoji}" data-cost="${cost}">${owned?'Place ♡':'⭐ '+cost}</button></div>`}).join('')}</div></section><section class="card"><h2>All twelve themes 🌷</h2><div class="theme-grid">${bookThemes.map((th,i)=>`<button class="theme-tile ${bookMonth===i?'current':''}" style="background:${th[2]}" data-month="${i}"><span>${th[0]}</span><b>${new Date(2026,i,1).toLocaleString('en-GB',{month:'short'})}</b><small>${th[1]}</small></button>`).join('')}</div></section>`}
function home(){let mood=state.moods[today()]||'';return `<section class="card hero"><div class="flex between"><div><p class="muted">WELCOME TO YOUR GLOW SPACE</p><h1>You're blooming! ♡</h1><p>Small steps count. Make today yours.</p></div><span class="big">🦋</span></div><div class="flex between"><b>Today's goals</b><span>${todayCount()}/${state.goals.length}</span></div><div class="progress"><div style="width:${state.goals.length?100*todayCount()/state.goals.length:0}%"></div></div></section><section class="grid" style="margin-top:15px"><div class="tile"><div class="big">🔥</div><div class="stat">${streak()}</div><div class="muted">day streak</div></div><div class="tile"><div class="big">⭐</div><div class="stat">${level()}</div><div class="muted">glow level</div></div><div class="tile"><div class="big">💧</div><div class="stat">${state.water[today()]||0}</div><div class="muted">glasses today</div></div></section><section class="card"><h2>How are you feeling? 💗</h2><p class="muted">Every mood is okay. Pick one for today.</p><div class="moods">${['😢','😕','😐','🙂','🥰'].map(x=>`<button data-mood="${x}" class="${mood===x?'selected':''}" aria-label="Mood ${x}">${x}</button>`).join('')}</div></section><section class="card"><h2>Hydration check 💧</h2><p class="muted">Keep track of your water, at your own pace.</p><div class="flex between"><button class="btn secondary" id="waterMinus">−</button><b>${state.water[today()]||0} glasses logged</b><button class="btn" id="waterPlus">+ Add glass</button></div></section><section class="card"><div class="flex between"><h2>Today's challenges 🎀</h2><button class="btn secondary" data-page="Goals">All goals →</button></div>${state.goals.slice(0,4).map(g=>goalRow(g)).join('')||'<p>Add your first goal!</p>'}</section>`}function goalRow(g){return `<div class="goal"><span class="emoji">${safe(g.icon)}</span><div class="grow"><b class="${completed(g)?'done':''}">${safe(g.name)}</b><div class="muted">+${g.points} stars · ${g.dates.length} completions</div></div><button data-toggle="${safe(g.id)}" aria-label="${completed(g)?'Undo':'Complete'} goal">${completed(g)?'✅':'◯'}</button>${page==='Goals'?`<button data-edit="${safe(g.id)}" aria-label="Edit goal">✏️</button><button data-delete="${safe(g.id)}" aria-label="Delete goal">🗑️</button>`:''}</div>`}function goals(){let g=state.goals.find(x=>x.id===editing);return `<section class="card"><h1>My little goals 🎯</h1><p class="muted">Create your own challenges. You choose what matters!</p><form id="goalForm"><label for="goalName">Goal name</label><input id="goalName" maxlength="90" required placeholder="e.g. Practise drawing" value="${safe(g?.name||'')}"><div class="grid"><div><label for="goalIcon">Icon</label><select id="goalIcon">${['🎀','📚','🌸','💗','🧸','🎨','🏃','🎵','💧','✨'].map(x=>`<option ${x===(g?.icon||'🎀')?'selected':''}>${x}</option>`).join('')}</select></div><div><label for="goalPoints">Stars per day</label><select id="goalPoints">${[5,10,15,20,25].map(x=>`<option value="${x}" ${x===(g?.points||15)?'selected':''}>${x} stars</option>`).join('')}</select></div></div><div class="flex" style="margin-top:12px"><button class="btn" type="submit">${g?'Save changes':'＋ Add goal'}</button>${g?'<button class="btn secondary" type="button" id="cancelEdit">Cancel</button>':''}</div></form></section><section class="card"><h2>Your goals (${state.goals.length})</h2>${state.goals.map(goalRow).join('')||'<p class="muted">No goals yet.</p>'}</section>`}const prizes=[{id:'bow',icon:'🎀',name:'Ribbon badge',cost:30},{id:'butterfly',icon:'🦋',name:'Butterfly badge',cost:65},{id:'crown',icon:'👑',name:'Glow crown',cost:110},{id:'flower',icon:'🌺',name:'Bloom badge',cost:160}];const gardenAreas=[{id:'meadow',name:'Rose Meadow',icon:'🌷',cost:0,description:'Your first little patch of magic'},{id:'pond',name:'Lily Pond',icon:'🪷',cost:25,description:'A peaceful pond with lily pads'},{id:'butterfly',name:'Butterfly Grove',icon:'🦋',cost:50,description:'A home for fluttering butterflies'},{id:'orchard',name:'Cherry Orchard',icon:'🌸',cost:90,description:'Pink blossoms everywhere'},{id:'moon',name:'Moonlight Garden',icon:'🌙',cost:140,description:'A sparkling secret night garden'},{id:'castle',name:'Fairy Castle',icon:'🏰',cost:200,description:'Your magical garden finale'}];function garden(){let n=lifetime(),owned=state.gardenUnlocked||[];return `<section class="card hero"><h1>My Enchanted Glow Garden 🌸</h1><p>Complete goals to grow flowers and earn stars. Use your stars to unlock new places in your very own garden!</p><div class="garden-scene"><div class="garden-sky">☁️ ☀️ ☁️</div><div class="garden-land">${Array.from({length:Math.min(30,Math.max(1,Math.floor(n/3)+1))},(_,i)=>`<span title="A flower grown from your goals">${['🌷','🌼','🌸','🌻','🌹'][i%5]}</span>`).join('')}</div><div class="garden-path">🦋 🌱 🐝</div></div><p class="muted">${n} goal completions · ⭐ ${earned()} stars available · ${1+owned.length}/${gardenAreas.length} areas unlocked</p></section><section class="card"><h2>Explore & unlock your garden 🗺️</h2><p class="muted">New areas stay unlocked forever, even after you spend your stars.</p><div class="garden-map">${gardenAreas.map((area,i)=>{let unlocked=area.cost===0||owned.includes(area.id);return `<div class="garden-zone ${unlocked?'zone-open':'zone-locked'}"><div class="zone-art">${unlocked?area.icon:'🔒'}</div><h3>${area.name}</h3><p class="muted">${unlocked?area.description:'A magical surprise awaits!'}</p>${unlocked?'<span class="badge">✨ Explored</span>':`<button class="btn secondary" data-area="${area.id}" ${earned()<area.cost?'disabled':''}>Unlock ⭐ ${area.cost}</button>`}</div>`}).join('')}</div></section><section class="card"><h2>Bloom collection 🌺</h2><p class="muted">Every 5 goal completions earns another flower in your collection.</p><div style="font-size:28px;line-height:2">${Array.from({length:Math.min(30,Math.floor(n/5))},(_,i)=>['🌷','🌸','🌼','🌹'][i%4]).join(' ')||'🌱 Your first bloom is waiting!'}</div><div class="progress"><div style="width:${n%5*20}%"></div></div><p class="muted">${n%5}/5 to your next flower</p></section>`}function rewards(){return `<section class="card hero"><h1>Glow Boutique 🎁</h1><p>Earn stars by completing your goals, then unlock lovely digital badges!</p><p class="pill" style="display:inline-block">⭐ ${earned()} available</p></section><section class="card">${prizes.map(p=>`<div class="goal"><span class="emoji">${p.icon}</span><div class="grow"><b>${p.name}</b><div class="muted">⭐ ${p.cost}</div></div><button class="btn secondary" data-prize="${p.id}" ${state.unlocked.includes(p.id)||earned()<p.cost?'disabled':''}>${state.unlocked.includes(p.id)?'Owned':'Unlock'}</button></div>`).join('')}</section><section class="card"><h2>Achievements ⭐</h2>${[[1,'First Sparkle'],[5,'Little Bloom'],[15,'Goal Getter'],[30,'Superstar']].map(([n,label])=>`<span class="badge">${lifetime()>=n?'🏆':'🔒'} ${label} (${n})</span>`).join('')}<p class="muted">Level ${level()} · ${lifetime()} total completions</p></section>`}function hydration(){let amount=state.water[today()]||0;return `<section class="card hero"><h1>Hydration Check 💧</h1><p>A gentle place to record drinks of water. Everyone needs different amounts, so there's no required target.</p><div class="water-count">${amount} <span>glasses logged today</span></div><div class="flex between"><button class="btn secondary" id="waterMinus">− Remove one</button><button class="btn" id="waterPlus">+ Add a glass</button></div></section><section class="card"><h2>Your recent check-ins</h2>${Array.from({length:7},(_,i)=>{let d=dateBefore(today(),i);return `<div class="goal"><span class="emoji">💧</span><div class="grow"><b>${d===today()?'Today':d}</b></div><strong>${state.water[d]||0} glasses</strong></div>`}).join('')}</section>`}function moodPage(){let moods=['😢','😕','😐','🙂','🥰'],current=state.moods[today()]||'';return `<section class="card hero"><h1>My Mood Tracker 💗</h1><p>How are you feeling today? All feelings are welcome here.</p><div class="moods">${moods.map(x=>`<button data-mood="${x}" class="${current===x?'selected':''}" aria-label="Choose mood ${x}">${x}</button>`).join('')}</div><p class="muted" style="margin-top:16px">${current?'Your mood today: '+current:'Choose an emoji to check in ♡'}</p></section><section class="card"><h2>My mood diary 🌷</h2>${Array.from({length:7},(_,i)=>{let d=dateBefore(today(),i);return `<div class="goal"><span class="emoji">${state.moods[d]||'♡'}</span><div class="grow"><b>${i===0?'Today':d}</b></div><span class="muted">${state.moods[d]?'Recorded':'No check-in'}</span></div>`}).join('')}</section>`}
function journal(){return `<section class="card"><h1>My Glow Journal 📔</h1><p class="muted">A private space on this device to write about your day.</p><form id="journalForm"><label for="entry">Today's thoughts</label><textarea id="entry" maxlength="2000" rows="5" required placeholder="Today I felt proud because..."></textarea><button class="btn" style="margin-top:10px">Save entry ♡</button></form></section><section class="card"><h2>Past entries</h2>${state.journal.map(e=>`<div class="entry"><div class="flex between"><b>${safe(e.date)}</b><button class="btn ghost" data-jdelete="${safe(e.id)}">Delete</button></div>${safe(e.text)}</div>`).join('')||'<p class="muted">Your journal is waiting for its first page.</p>'}<p class="note">Entries are saved only in this browser, not password-protected. Avoid writing secrets or sensitive information on a shared device.</p></section>`}function formatTime(){return String(Math.floor(timerSeconds/60)).padStart(2,'0')+':'+String(timerSeconds%60).padStart(2,'0')}function focus(){return `<section class="card hero"><h1>Focus Mode 🎧</h1><p>Choose a gentle focus session. Take breaks whenever you need.</p><label for="focusLength">Session length</label><select id="focusLength">${[5,10,15,25].map(x=>`<option value="${x}" ${timerLength===x?'selected':''}>${x} minutes</option>`).join('')}</select><div class="timer" id="timerDisplay">${formatTime()}</div><div class="flex" style="justify-content:center"><button class="btn" id="timerToggle">${timerRunning?'Pause':'Start'} ♡</button><button class="btn secondary" id="timerReset">Reset</button></div><p class="muted" style="text-align:center;margin-top:14px">${state.focusSessions} sessions completed · ${state.focusMinutes} focus minutes</p></section>`}function me(){let a=state.avatar;return `<section class="card"><h1>My Glow Avatar 👑</h1><div class="avatar">${safe(a.background)} ${safe(a.face)} ${safe(a.accessory)}</div><label for="face">Choose a character</label><select id="face">${['👩','👨','🧑','👩🏽','👨🏾','🧑🏻','👩🏿','👨🏻','🐱','🐰','🦊'].map(x=>`<option ${a.face===x?'selected':''}>${x}</option>`).join('')}</select><label for="accessory">Accessory</label><select id="accessory">${['🎀','👑','🕶️','🌷','✨','🧢'].map(x=>`<option ${a.accessory===x?'selected':''}>${x}</option>`).join('')}</select><label for="background">Background</label><select id="background">${['🌸','🦋','🌈','⭐','🌙','🍓'].map(x=>`<option ${a.background===x?'selected':''}>${x}</option>`).join('')}</select></section><section class="card"><h2>Your Glow Stats 💗</h2><div class="grid"><div class="tile"><div class="stat">${level()}</div>Level</div><div class="tile"><div class="stat">${streak()}</div>Streak</div><div class="tile"><div class="stat">${lifetime()}</div>Completions</div></div></section><section class="card"><h2>Your data 💾</h2><p class="muted">Saved on this device only. Clearing browser data may erase it. Export a backup to keep it safe.</p><div class="flex wrap"><button class="btn secondary" id="export">Download backup</button><label class="btn secondary" for="import" style="margin:0;cursor:pointer">Restore backup</label><input type="file" id="import" accept="application/json" style="display:none"></div><p class="note">GlowUp 3.0 • Free prototype • No accounts, ads or payments.</p></section>`}function bind(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{page=b.dataset.page;render()});document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=()=>{let g=state.goals.find(x=>x.id===b.dataset.toggle);if(!g)return;g.dates=g.dates||[];if(completed(g)){g.dates=g.dates.filter(x=>x!==today());state.stars=Math.max(0,state.stars-g.points)}else{g.dates.push(today());state.stars+=g.points}save();render()});document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{editing=b.dataset.edit;render()});document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this goal?'))return;state.goals=state.goals.filter(x=>x.id!==b.dataset.delete);editing=null;save();render()});let gf=document.getElementById('goalForm');if(gf)gf.onsubmit=e=>{e.preventDefault();let name=document.getElementById('goalName').value.trim(),icon=document.getElementById('goalIcon').value,points=Number(document.getElementById('goalPoints').value);if(!name)return;if(editing){let g=state.goals.find(x=>x.id===editing);if(g)Object.assign(g,{name,icon,points})}else state.goals.push({id:'g'+Date.now()+'-'+Math.random().toString(36).slice(2),name,icon,points,dates:[]});editing=null;save();render()};let ce=document.getElementById('cancelEdit');if(ce)ce.onclick=()=>{editing=null;render()};document.querySelectorAll('[data-mood]').forEach(b=>b.onclick=()=>{state.moods[today()]=b.dataset.mood;save();render()});let wp=document.getElementById('waterPlus'),wm=document.getElementById('waterMinus');if(wp)wp.onclick=()=>{state.water[today()]=Math.min(99,(state.water[today()]||0)+1);save();render()};if(wm)wm.onclick=()=>{state.water[today()]=Math.max(0,(state.water[today()]||0)-1);save();render()};document.querySelectorAll('[data-area]').forEach(b=>b.onclick=()=>{let area=gardenAreas.find(x=>x.id===b.dataset.area);if(!area||earned()<area.cost||(state.gardenUnlocked||[]).includes(area.id))return;state.spent+=area.cost;state.gardenUnlocked=state.gardenUnlocked||[];state.gardenUnlocked.push(area.id);save();render()});document.querySelectorAll('[data-prize]').forEach(b=>b.onclick=()=>{let p=prizes.find(x=>x.id===b.dataset.prize);if(!p||earned()<p.cost||state.unlocked.includes(p.id))return;state.spent+=p.cost;state.unlocked.push(p.id);save();render()});let jf=document.getElementById('journalForm');if(jf)jf.onsubmit=e=>{e.preventDefault();let t=document.getElementById('entry').value.trim();if(!t)return;state.journal.unshift({id:'j'+Date.now(),date:new Date().toLocaleString(),text:t});save();render()};document.querySelectorAll('[data-jdelete]').forEach(b=>b.onclick=()=>{if(!confirm('Delete this journal entry?'))return;state.journal=state.journal.filter(x=>x.id!==b.dataset.jdelete);save();render()});['face','accessory','background'].forEach(k=>{let el=document.getElementById(k);if(el)el.onchange=()=>{state.avatar[k]=el.value;save();render()}});let fl=document.getElementById('focusLength');if(fl)fl.onchange=()=>{timerRunning=false;clearInterval(timerHandle);timerLength=Number(fl.value);timerSeconds=timerLength*60;render()};let tt=document.getElementById('timerToggle');if(tt)tt.onclick=()=>{timerRunning=!timerRunning;if(timerRunning){clearInterval(timerHandle);timerHandle=setInterval(()=>{if(!timerRunning)return;timerSeconds--;let el=document.getElementById('timerDisplay');if(el)el.textContent=formatTime();if(timerSeconds<=0){clearInterval(timerHandle);timerRunning=false;state.focusSessions++;state.focusMinutes+=timerLength;save();alert('Focus session complete! Great job 🌷');timerSeconds=timerLength*60;render()}},1000)}else clearInterval(timerHandle);render()};let tr=document.getElementById('timerReset');if(tr)tr.onclick=()=>{clearInterval(timerHandle);timerRunning=false;timerSeconds=timerLength*60;render()};document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>{bookSection=b.dataset.section;render()});document.querySelectorAll('[data-month]').forEach(b=>b.onclick=()=>{bookMonth=Number(b.dataset.month);render()});let prev=document.getElementById('prevBook'),next=document.getElementById('nextBook');if(prev)prev.onclick=()=>{bookMonth--;if(bookMonth<0){bookMonth=11;bookYear--}render()};if(next)next.onclick=()=>{bookMonth++;if(bookMonth>11){bookMonth=0;bookYear++}render()};let note=document.getElementById('bookNote');if(note)note.oninput=()=>{bookData().note=note.value;save()};document.querySelectorAll('[data-sticker]').forEach(b=>b.onclick=()=>{let emoji=b.dataset.sticker,cost=Number(b.dataset.cost),owned=cost===0||state.notebook.owned.includes(emoji);if(!owned){if(earned()<cost)return;state.spent+=cost;state.notebook.owned.push(emoji)}let arr=bookData().stickers;if(arr.length>=30){alert('This page has room for 30 stickers. Tap one to remove it!');return}arr.push({emoji,x:12+(arr.length%5)*17,y:12+(Math.floor(arr.length/5)%4)*19});save();render()});document.querySelectorAll('[data-remove-sticker]').forEach(b=>b.onclick=()=>{bookData().stickers.splice(Number(b.dataset.removeSticker),1);save();render()});let ex=document.getElementById('export');if(ex)ex.onclick=()=>{let blob=new Blob([JSON.stringify(state,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='glowup-backup.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};let imp=document.getElementById('import');if(imp)imp.onchange=async()=>{try{let obj=JSON.parse(await imp.files[0].text());if(!Array.isArray(obj.goals)||!Array.isArray(obj.journal)||!Array.isArray(obj.unlocked)||typeof obj.stars!=='number'||typeof obj.spent!=='number')throw Error('Invalid file');if(!confirm('Replace current GlowUp data with this backup?'))return;state={...initial(),...obj};save();render()}catch{alert('That does not look like a valid GlowUp backup.')}}}render();const welcomeButton=document.getElementById('enterGlowUp');welcomeButton.addEventListener('click',()=>{document.getElementById('welcomeScreen').hidden=true;document.querySelector('.tab.active')?.focus()});
</script></body></html>
